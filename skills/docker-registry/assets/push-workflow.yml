# Copy to .github/workflows/ in the repository that builds the image.
#
# Variables to define in the "prod" GitHub environment of that repository:
#   AWS_REGION          region of the registry stack, e.g. us-east-1
#   ECR_PUSH_ROLE_ARN   GitHubPushRoleArn output of the registry stack
#
# No AWS key is stored in GitHub: the job exchanges its OIDC token for temporary
# credentials (1 h) that can only push to the registry repository prefix.
name: Build and push the image to ECR

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  # ECR repository: registry prefix (RepositoryPrefix output) + lowercase name.
  IMAGE_NAME: gh/my-image

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Masks the AWS account ID in the logs, including in the ECR registry
          # address printed during the build.
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
