# A copier dans .github/workflows/ du depot qui construit l'image.
#
# Variables a definir dans l'environnement GitHub "prod" de ce depot :
#   AWS_REGION          region de la pile, ex. eu-west-3
#   ECR_PUSH_ROLE_ARN   sortie GitHubPushRoleArn de la pile
#
# Aucune cle AWS n'est stockee dans GitHub : le workflow echange son jeton OIDC
# contre des identifiants temporaires (1 h) limites au push dans gh/*.
name: Build et push de l'image vers ECR

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  # Nom du depot ECR : prefixe de la pile + nom en minuscules (ECR refuse les majuscules).
  IMAGE_NAME: gh/mon-image

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Masque le numero de compte AWS dans les journaux, y compris dans l'adresse
          # du registre ECR affichee lors du build.
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
